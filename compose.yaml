name: tongpin-classroom
services:
  classroom:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "3210:3210"
    environment:
      DATA_DIR: /app/data
      PUBLIC_URL: ${PUBLIC_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - tongpin-data:/app/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stop_grace_period: 35s
volumes:
  tongpin-data:
